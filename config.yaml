# Единый файл настроек сборщика. Изменяйте значения здесь, а не в исходном коде.

paths:
  # Файл со списком HTTPS-адресов источников подписок, по одному адресу в строке.
  input: input.txt
  # Каталог с итоговыми файлами vless.txt, trojan.txt, hysteria2.txt и tg_channels.txt.
  output_dir: output
  # Путь к обезличенному JSON-отчёту о последнем запуске.
  report: report.json
  # Путь к состоянию отпечатков профилей для учёта первого появления.
  state: .collector/state.json
  # Путь к списку качественных (одобренных) Telegram-каналов текущего запуска.
  tg_channels: output/tg_channels.txt
  # Путь к обезличенному состоянию качества каналов.
  telegram_state: .collector/channel_state.json
  # Внутренний реестр каналов, обнаруженных в текущем запуске.
  telegram_registry: .collector/tg_registry.txt
  # Путь к накопительному пулу профилей: он переживает запуски и хранит
  # отрендеренные строки вместе с датами добавления для недельного цикла.
  profile_pool: .collector/profile_pool.json

sources:
  # Максимальный допустимый возраст источника в часах по HTTP-заголовку Last-Modified.
  max_age_hours: 72
  # Число источников, одновременно загружаемых по HTTPS.
  concurrency: 48
  # Предельное время ожидания ответа одного источника в секундах (фазы чтения/записи).
  timeout_seconds: 12.0
  # Отдельный тайм-аут установки соединения: мёртвые хосты отсекаются быстрее.
  connect_timeout_seconds: 10.0
  # Жёсткий общий дедлайн одного источника в секундах, включая перенаправления
  # и повторные попытки: «капающий» сервер больше не может задержать этап навсегда.
  total_deadline_seconds: 30.0
  # Повторные попытки для временных сбоев (сети, 429/5xx); детерминированные
  # ошибки (безопасность редиректов, размер, UTF-8) не повторяются.
  retries: 2
  # Базовая пауза экспоненциального backoff между попытками; Retry-After уважается.
  retry_backoff_seconds: 1.0
  # Максимальный размер ответа источника в байтах; более крупный ответ отклоняется.
  max_response_bytes: 5242880
  # Максимальное число разрешённых HTTPS-перенаправлений для одного источника.
  max_redirects: 3
  # Значение заголовка User-Agent, отправляемого при запросе источников.
  user_agent: secure-subscription-collector/0.1

static_filter:
  # Число потоков для разбора URI, строгой проверки безопасности и глубокого анализа профилей.
  workers: 160
  # Число строк URI, передаваемых на разбор одной группой.
  batch_size: 1024

behavior:
  # Если true, публикуются только профили, впервые замеченные не более max_age_hours назад.
  strict_first_seen: false
  # Если true, завершать программу с кодом 2, когда за запуск не добавлено ни одного профиля.
  fail_on_empty: false

telegram:
  # Глубина окна публичных превью в часах: собираются только сообщения за последние трое суток.
  max_post_age_hours: 72
  # Предел числа профилей от одного канала за окно, суммарно по всем протоколам.
  max_profiles_per_channel: 1000
  # Переоценка старых каналов из реестра каждые N запусков конвейера.
  reevaluation_interval: 3
  # Предел числа страниц пагинации на канал; 50 страниц покрывают лимит
  # 1000 профилей за окно и не позволяют одному каналу растянуть этап на часы.
  max_pages_per_channel: 50
  # Число каналов, чьи превью загружаются одновременно.
  concurrency: 12
  # Предельное время ожидания ответа одной страницы предпросмотра в секундах.
  timeout_seconds: 12.0
  # Отдельный тайм-аут установки соединения с t.me.
  connect_timeout_seconds: 10.0
  # Жёсткий общий дедлайн одной страницы предпросмотра, включая повторы:
  # медленный ответ t.me не может остановить этап молча и навсегда.
  total_deadline_seconds: 25.0
  # Повторные попытки временных сбоев (429/5xx, сеть) с учётом Retry-After.
  retries: 2
  # Базовая пауза экспоненциального backoff между попытками страницы.
  retry_backoff_seconds: 1.0
  # Максимальный размер страницы предпросмотра в байтах.
  max_response_bytes: 5242880
  # Максимальное число разрешённых HTTPS-перенаправлений для одной страницы.
  max_redirects: 3
  quality:
    # Балл, начиная с которого канал признаётся качественным.
    approval_score: 45.0
    # Число наблюдений, после которого канал может получить статус approved.
    min_evidence_runs: 2
    # Минимум URI-кандидатов в окне, иначе канал исключается.
    min_supported_candidates: 1
    # Минимум свежих сообщений в окне, иначе канал исключается.
    min_fresh_posts: 1
    # Минимальная уверенность оценки; ниже канал переводится в watch.
    minimum_confidence: 0.3
    # Надбавка к порогу для новых каналов с малой историей; канал с баллом выше
    # суммы порога и надбавки одобряется уже по первому наблюдению.
    new_channel_margin: 8.0
    # Допустимый недобор балла для перевода в watch вместо excluded.
    near_threshold_margin: 12.0
    # Период полураспада влияния прошлых оценок в часах.
    history_half_life_hours: 72.0
    # Сглаживающие приоры доли профилей, прошедших глубокий анализ.
    analysis_prior_passes: 1.0
    analysis_prior_failures: 1.0
    # Скидка с порога одобрения за каждое наблюдение сверх минимальных двух.
    evidence_discount: 2.0
    # Предельная суммарная скидка за накопленные наблюдения.
    discount_floor: 15.0
    # Учёт момента роста: снижение порога при улучшении балла, не больше этого значения.
    momentum_cap: 5.0
    # Относительное одобрение по медиане пула каналов (не ниже relative_floor).
    relative_approval: true
    relative_floor: 10.0
    # Веса компонент итогового балла канала.
    activity_weight: 15.0
    supported_yield_weight: 15.0
    static_security_weight: 20.0
    uniqueness_weight: 10.0
    nonduplication_weight: 5.0
    profile_coverage_weight: 10.0
    text_depth_weight: 5.0
    cadence_weight: 5.0
    depth_weight: 15.0

speed_test:
  # Замер скорости профиля скачиванием тестового файла сквозь его собственный туннель.
  enabled: true
  # strict — отбрасывать профили, скорость которых измерить нельзя; best_effort — оставлять.
  mode: best_effort
  # Минимально допустимая скорость в КБ/с для записи в конечные файлы.
  min_kbps: 200
  # Сколько байт скачать через туннель для замера (не меньше 262144).
  download_bytes: 2097152
  # Окно измерения скорости и общий бюджет соединения, секунды.
  max_duration_seconds: 8
  timeout_seconds: 12
  # Число одновременных замеров; допустимый диапазон от 50 до 60.
  workers: 56
  # Число профилей в одной группе замера.
  batch_size: 128
  # HTTP-адрес загружаемого файла для замера.
  download_url: http://cachefly.cachefly.net/5mb.test
  # Прогрев перед замером в секундах: начальные байты поглощают медленный старт TCP
  # и не искажают первое окно измерения.
  warmup_seconds: 0.75
  # На сколько равных окон делится замер: из окон считаются средняя, пиковая скорость,
  # джиттер и стабильность; допустимый диапазон от 1 до 8.
  windows: 4
  # Скорость «эталона» в КБ/с для нормировки скоростной компоненты итоговой оценки 0-100.
  target_kbps: 2000.0
  # Минимальная стабильность (отношение худшего окна к средней) от 0.0 до 1.0;
  # 0.0 отключает проверку стабильности.
  min_stability: 0.0

publication:
  # Накопительная публикация: конечные файлы дополняются между запусками,
  # а не заменяются профилями текущего запуска.
  # Жёсткий предел записей на каждый протокол; при превышении вытесняются
  # самые старые по времени последнего появления записи.
  max_profiles_per_protocol: 10000
  # Длительность цикла накопления в днях: шесть дней пул пополняется,
  # в первый запуск седьмого дня он сбрасывается до нуля и цикл начинается заново.
  cycle_days: 6

reachability:
  # Число одновременных TCP/TLS-проверок конечных точек; допустимый диапазон от 50 до 60.
  workers: 56
  # Число конечных точек в одной группе проверки.
  batch_size: 256
  # Максимально допустимое время ответа одной попытки TCP/TLS в миллисекундах (не более 300).
  timeout_ms: 300
  # Число попыток на одну конечную точку: одиночный тайм-аут больше не отбрасывает
  # живой сервер из-за случайной потери пакета; результаты агрегируются.
  attempts: 3
  # Пауза между неудачными попытками одной конечной точки в миллисекундах.
  retry_delay_ms: 200
  # Грейд «отлично»: медианная задержка рукопожатия не выше значения в миллисекундах.
  grade_excellent_ms: 150
  # Грейд «хорошо»: медианная задержка не выше значения; всё большее — грейд «средне».
  grade_good_ms: 300
