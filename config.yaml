# Единый файл настроек сборщика. Изменяйте значения здесь, а не в исходном коде.

paths:
  # Файл со списком HTTPS-адресов источников подписок, по одному адресу в строке.
  input: input.txt
  # Каталог с итоговыми файлами vless.txt, trojan.txt, hysteria2.txt и tg_channels.txt.
  output_dir: output
  # Путь к обезличенному JSON-отчёту о последнем запуске.
  report: report.json
  # Путь к состоянию отпечатков профилей для учёта первого появления.
  state: .collector/state.json
  # Путь к списку качественных (одобренных) Telegram-каналов текущего запуска.
  tg_channels: output/tg_channels.txt
  # Путь к обезличенному состоянию качества каналов.
  telegram_state: .collector/channel_state.json
  # Внутренний реестр каналов, обнаруженных в текущем запуске.
  telegram_registry: .collector/tg_registry.txt

sources:
  # Максимальный допустимый возраст источника в часах по HTTP-заголовку Last-Modified.
  max_age_hours: 72
  # Число источников, одновременно загружаемых по HTTPS.
  concurrency: 48
  # Предельное время ожидания ответа одного источника в секундах.
  timeout_seconds: 20.0
  # Максимальный размер ответа источника в байтах; более крупный ответ отклоняется.
  max_response_bytes: 5242880
  # Максимальное число разрешённых HTTPS-перенаправлений для одного источника.
  max_redirects: 3
  # Значение заголовка User-Agent, отправляемого при запросе источников.
  user_agent: secure-subscription-collector/0.1

static_filter:
  # Число потоков для разбора URI, строгой проверки безопасности и глубокого анализа профилей.
  workers: 160
  # Число строк URI, передаваемых на разбор одной группой.
  batch_size: 1024

behavior:
  # Если true, публикуются только профили, впервые замеченные не более max_age_hours назад.
  strict_first_seen: false
  # Если true, завершать программу с кодом 2, когда за запуск не добавлено ни одного профиля.
  fail_on_empty: false

telegram:
  # Глубина окна публичных превью в часах: собираются только сообщения за последние трое суток.
  max_post_age_hours: 72
  # Предел числа профилей от одного канала за окно, суммарно по всем протоколам.
  max_profiles_per_channel: 1000
  # Переоценка старых каналов из реестра каждые N запусков конвейера.
  reevaluation_interval: 3
  # Необязательный предел числа страниц пагинации на канал.
  max_pages_per_channel: null
  # Число каналов, чьи превью загружаются одновременно.
  concurrency: 12
  # Предельное время ожидания ответа одной страницы предпросмотра в секундах.
  timeout_seconds: 20.0
  # Максимальный размер страницы предпросмотра в байтах.
  max_response_bytes: 5242880
  # Максимальное число разрешённых HTTPS-перенаправлений для одной страницы.
  max_redirects: 3
  quality:
    # Балл, начиная с которого канал признаётся качественным.
    approval_score: 45.0
    # Число наблюдений, после которого канал может получить статус approved.
    min_evidence_runs: 2
    # Минимум URI-кандидатов в окне, иначе канал исключается.
    min_supported_candidates: 1
    # Минимум свежих сообщений в окне, иначе канал исключается.
    min_fresh_posts: 1
    # Минимальная уверенность оценки; ниже канал переводится в watch.
    minimum_confidence: 0.3
    # Надбавка к порогу для новых каналов с малой историей; канал с баллом выше
    # суммы порога и надбавки одобряется уже по первому наблюдению.
    new_channel_margin: 8.0
    # Допустимый недобор балла для перевода в watch вместо excluded.
    near_threshold_margin: 12.0
    # Период полураспада влияния прошлых оценок в часах.
    history_half_life_hours: 72.0
    # Сглаживающие приоры доли профилей, прошедших глубокий анализ.
    analysis_prior_passes: 1.0
    analysis_prior_failures: 1.0
    # Скидка с порога одобрения за каждое наблюдение сверх минимальных двух.
    evidence_discount: 2.0
    # Предельная суммарная скидка за накопленные наблюдения.
    discount_floor: 15.0
    # Учёт момента роста: снижение порога при улучшении балла, не больше этого значения.
    momentum_cap: 5.0
    # Относительное одобрение по медиане пула каналов (не ниже relative_floor).
    relative_approval: true
    relative_floor: 10.0
    # Веса компонент итогового балла канала.
    activity_weight: 15.0
    supported_yield_weight: 15.0
    static_security_weight: 20.0
    uniqueness_weight: 10.0
    nonduplication_weight: 5.0
    profile_coverage_weight: 10.0
    text_depth_weight: 5.0
    cadence_weight: 5.0
    depth_weight: 15.0

reachability:
  # Число одновременных TCP/TLS-проверок конечных точек; допустимый диапазон от 50 до 60.
  workers: 56
  # Число конечных точек в одной группе проверки.
  batch_size: 256
  # Максимально допустимое время ответа TCP/TLS в миллисекундах (не более 300).
  timeout_ms: 300
