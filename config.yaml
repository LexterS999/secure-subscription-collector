# Единый файл настроек сборщика. Изменяйте значения здесь, а не в исходном коде.

paths:
  # Файл со списком HTTPS-адресов источников подписок, по одному адресу в строке.
  input: input.txt
  # Каталог, в который добавляются итоговые файлы vless.txt, trojan.txt и hysteria2.txt.
  output_dir: output
  # Путь к обезличенному JSON-отчёту о последнем запуске.
  report: report.json
  # Путь к состоянию отпечатков профилей для учёта первого появления.
  state: .collector/state.json
  # Обезличенное состояние адаптивной оценки публичных Telegram-каналов.
  telegram_state: .collector/channel_state.json
  # Служебный реестр обнаруженных публичных Telegram-каналов.
  telegram_registry: .collector/tg_registry.txt
  # Итоговый отсортированный список одобренных публичных Telegram-каналов.
  tg_channels: tg_channels.txt

sources:
  # Максимальный допустимый возраст источника в часах по HTTP-заголовку Last-Modified.
  max_age_hours: 72
  # Число источников, одновременно загружаемых по HTTPS.
  concurrency: 48
  # Предельное время ожидания ответа одного источника в секундах.
  timeout_seconds: 20.0
  # Максимальный размер ответа источника в байтах; более крупный ответ отклоняется.
  max_response_bytes: 5242880
  # Максимальное число разрешённых HTTPS-перенаправлений для одного источника.
  max_redirects: 3
  # Значение заголовка User-Agent, отправляемого при запросе источников.
  user_agent: secure-subscription-collector/0.1

static_filter:
  # Число потоков для разбора URI и статической проверки безопасности профилей.
  workers: 160
  # Число строк URI, передаваемых на разбор одной группой.
  batch_size: 1024

behavior:
  # Если true, публикуются только профили, впервые замеченные не более max_age_hours назад.
  strict_first_seen: false
  # Если true, завершать программу с кодом 2, когда за запуск не добавлено ни одного профиля.
  fail_on_empty: false

telegram:
  # Окно возраста публичных сообщений Telegram в часах; учитываются только надёжно датированные посты.
  max_post_age_hours: 24
  # Ограничение числа профилей из одного канала отсутствует; значение должно оставаться null.
  max_profiles_per_channel: null
  # Ограничение числа страниц публичного preview отсутствует; значение должно оставаться null.
  max_pages_per_channel: null
  # Число одновременных запросов к публичным preview-страницам.
  concurrency: 12
  # Предельное время ожидания одного preview-ответа в секундах.
  timeout_seconds: 20.0
  # Максимальный размер HTML-ответа Telegram в байтах.
  max_response_bytes: 5242880
  # Максимальное число HTTPS-перенаправлений в пределах разрешённого домена Telegram.
  max_redirects: 3
  quality:
    # Базовый проходной балл качества после накопления достаточной уверенности.
    approval_score: 70.0
    # Минимальное число независимых наблюдений для уверенного решения.
    min_evidence_runs: 2
    # Минимальное число URI поддерживаемых схем в наблюдении.
    min_supported_candidates: 2
    # Минимальное число надёжно датированных свежих сообщений в наблюдении.
    min_fresh_posts: 2
    # Дополнительный требуемый балл для нового канала при низкой уверенности.
    new_channel_margin: 20.0
    # Нижняя граница уверенности для статуса approved.
    minimum_confidence: 0.5
    # Период полураспада исторической оценки в часах.
    history_half_life_hours: 72.0
    # Веса компонентов оценки; итоговый балл нормализуется к шкале 0–100.
    activity_weight: 20.0
    supported_yield_weight: 20.0
    static_security_weight: 25.0
    uniqueness_weight: 15.0
    nonduplication_weight: 10.0
    # Доля свежих постов, в которых действительно есть поддерживаемые профили.
    profile_coverage_weight: 10.0
    # Насыщенность содержимого постов: слишком короткие рекламные посты штрафуются.
    text_depth_weight: 5.0
    # Адаптивная оценка частоты публикации: слишком редкие и слишком шумные каналы штрафуются.
    cadence_weight: 5.0
    # Насколько сильно историческая надёжность двигает итоговый балл и проходной порог.
    history_weight: 15.0
    # Зона около порога, в которой канал остаётся под наблюдением вместо жёсткого исключения.
    near_threshold_margin: 8.0
