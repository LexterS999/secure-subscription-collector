name: Update secure subscriptions

'on':
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secure-subscription-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify Xray core
        run: |
          set -euo pipefail
          xray_version="$(PYTHONPATH=src python -c 'from pathlib import Path; from subscription_collector.config_loader import load_config; print(load_config(Path("config.yaml")).xray.version)')"
          xray_dir="$RUNNER_TEMP/xray-core"
          base_url="https://github.com/XTLS/Xray-core/releases/download/${xray_version}"
          rm -rf "$xray_dir"
          mkdir -p "$xray_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$xray_dir/Xray-linux-64.zip" \
            "$base_url/Xray-linux-64.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$xray_dir/Xray-linux-64.zip.dgst" \
            "$base_url/Xray-linux-64.zip.dgst"
          expected_sha512="$(sed -n 's/^SHA2-512= //p' "$xray_dir/Xray-linux-64.zip.dgst")"
          test -n "$expected_sha512"
          printf '%s  %s\n' "$expected_sha512" "$xray_dir/Xray-linux-64.zip" | sha512sum --check --status
          unzip -q "$xray_dir/Xray-linux-64.zip" -d "$xray_dir"
          chmod 0755 "$xray_dir/xray"
          "$xray_dir/xray" version
      - name: Collect and validate subscriptions through Xray
        run: |
          PYTHONPATH=src python -m subscription_collector \
            --xray-path "$RUNNER_TEMP/xray-core/xray"
      - name: Commit changed outputs
        run: |
          git add --all -- output report.json .collector/state.json
          if git diff --cached --quiet; then
            echo "No output changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update subscription outputs [skip ci]"
          git push
      - name: Remove temporary Xray core
        if: always()
        run: rm -rf "$RUNNER_TEMP/xray-core"
