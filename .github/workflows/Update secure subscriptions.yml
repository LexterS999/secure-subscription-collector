name: Update secure subscriptions
'on':
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secure-subscription-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect quality-gated Telegram preview profiles
        run: PYTHONPATH=src python -m subscription_collector
      - name: Upload approved collection artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-collection
          if-no-files-found: error
          path: |
            output/
            report.json
            .collector/state.json
            .collector/channel_state.json
            tg_channels
  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download approved collection artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-collection
          path: .
      - name: Commit changed collection artifacts
        run: |
          git add -- output report.json .collector/state.json .collector/channel_state.json tg_channels
          if git diff --cached --quiet; then
            echo "No collection artifact changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update quality-gated subscription outputs [skip ci]"
          git push
