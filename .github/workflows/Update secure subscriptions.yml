name: Update secure subscriptions

'on':
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: secure-subscription-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and filter subscriptions
        run: PYTHONPATH=src python -m subscription_collector --input input.txt
      - name: Commit changed outputs
        run: |
          if git diff --quiet -- output.txt report.json .collector/state.json; then
            echo "No output changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.txt report.json .collector/state.json
          git commit -m "chore: update secure subscriptions [skip ci]"
          git push
