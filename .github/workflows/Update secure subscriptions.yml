name: Scaper

'on':
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secure-subscription-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and validate subscriptions
        run: |
          PYTHONPATH=src python -m subscription_collector
      - name: Commit changed outputs
        run: |
          git add --all -- output report.json .collector/state.json .collector/channel_state.json output/tg_channels.txt
          if git diff --cached --quiet; then
            echo "No output changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update subscription outputs [skip ci]"
          git push
